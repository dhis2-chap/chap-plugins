name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm verify

    deploy-demo:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: verify
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-demo
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Deploy all plugins and refresh the CHAP Plugins dashboard
              if: vars.DHIS2_DEMO_URL != ''
              env:
                  DHIS2_DEMO_URL: ${{ vars.DHIS2_DEMO_URL }}
                  D2_USERNAME: ${{ secrets.DHIS2_DEMO_USERNAME }}
                  D2_PASSWORD: ${{ secrets.DHIS2_DEMO_PASSWORD }}
              run: pnpm deploy:demo --dashboard "CHAP Plugins" --star --grant-roles
            - name: Demo deploy skipped
              if: vars.DHIS2_DEMO_URL == ''
              run: |
                  echo "::notice::Demo deploy skipped — set the repository variable DHIS2_DEMO_URL and the secrets DHIS2_DEMO_USERNAME / DHIS2_DEMO_PASSWORD to enable it."
